<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CapitalFlow - บันทึกรายจ่าย</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
      appearance: none;
    }
    select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem top 50%;
      background-size: 0.65rem auto;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
      transition: transform 0.2s;
      margin-top: 0.5rem;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    #status {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #10b981;
      display: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>บันทึกรายการด่วน</h1>
    <form id="expenseForm">
      <div class="form-group">
        <label>วันที่ (Date)</label>
        <input type="date" id="date" required>
      </div>
      
      <div class="form-group" style="display: flex; gap: 1rem;">
        <div style="flex: 1;">
          <label>ประเภท (Type)</label>
          <select id="type" required>
            <option value="รายจ่าย">รายจ่าย</option>
            <option value="รายได้">รายได้</option>
            <option value="เงินออม">เงินออม</option>
            <option value="ลงทุน">ลงทุน</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>ความถี่ (Freq)</label>
          <select id="frequency" required>
            <option value="ทั่วไป">ทั่วไป</option>
            <option value="คงที่">คงที่</option>
          </select>
        </div>
      </div>
      
      <div class="form-group">
        <label>หมวดหมู่ (Category)</label>
        <select id="category" required>
          <option value="อาหาร">อาหาร</option>
          <option value="เครื่องดื่ม">เครื่องดื่ม</option>
          <option value="ขนม">ขนม</option>
          <option value="น้ำมัน">น้ำมัน</option>
          <option value="เน็ต">เน็ต</option>
          <option value="บริการสตีมมิ่ง">บริการสตีมมิ่ง</option>
          <option value="เครื่องสำอาง">เครื่องสำอาง</option>
          <option value="ตัดผม">ตัดผม</option>
          <option value="บำรุงรถ">บำรุงรถ</option>
          <option value="รายจ่ายอื่น ๆ">รายจ่ายอื่น ๆ</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>รายการ (Item Name)</label>
        <input type="text" id="item" placeholder="เช่น ชาไข่มุก, ข้าวผัด" required autocomplete="off">
      </div>
      
      <div class="form-group">
        <label>จำนวนเงิน (Amount)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
      </div>
      
      <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
      <div id="status">✅ บันทึกสำเร็จแล้ว!</div>
    </form>
  </div>

  <script>
    // ==========================================
    // ตั้งค่าต่างๆ
    // ==========================================
    const LIFF_ID = '2010692516-e05uuk6k';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwXjfrF4Wh1U5mqxXPlf0r-gwu0edEbHENQSA06O-h4skR3oByW32A36kgnkplhY6eaqQ/exec';

    // ==========================================
    // LIFF Initialization
    // ==========================================
    let liffReady = false;

    async function initializeLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        liffReady = true;
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      } catch (err) {
        alert('LIFF init error: ' + err.message);
        console.error('LIFF init failed:', err);
        // ถ้าเปิดบนเบราว์เซอร์ปกติ (ไม่ผ่าน LINE) ก็ยังใช้ฟอร์มได้
        liffReady = false;
      }
    }
    initializeLiff();

    // ==========================================
    // ตั้งค่าวันปัจจุบัน
    // ==========================================
    document.getElementById('date').valueAsDate = new Date();

    // ==========================================
    // เปลี่ยนหมวดหมู่ตามประเภท
    // ==========================================
    const typeSelect = document.getElementById('type');
    const catSelect = document.getElementById('category');

    const categories = {
      'รายจ่าย': ['อาหาร', 'เครื่องดื่ม', 'ขนม', 'น้ำมัน', 'เน็ต', 'บริการสตีมมิ่ง', 'เครื่องสำอาง', 'ตัดผม', 'บำรุงรถ', 'รายจ่ายอื่น ๆ'],
      'รายได้': ['รายได้คงที่', 'รายได้อื่น ๆ'],
      'เงินออม': ['เงินออมฉุกเฉิน', 'เงินออมทั่วไป'],
      'ลงทุน': ['เงินลงทุน']
    };

    typeSelect.addEventListener('change', function(e) {
      var type = e.target.value;
      catSelect.innerHTML = '';
      categories[type].forEach(function(cat) {
        var option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        catSelect.appendChild(option);
      });
    });

    // ==========================================
    // ส่งข้อมูลฟอร์ม
    // ==========================================
    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault();

      var btn = document.getElementById('submitBtn');
      var status = document.getElementById('status');

      btn.textContent = 'กำลังบันทึก...';
      btn.disabled = true;
      status.style.display = 'none';

      var data = {
        date: document.getElementById('date').value,
        type: document.getElementById('type').value,
        category: document.getElementById('category').value,
        frequency: document.getElementById('frequency').value,
        item: document.getElementById('item').value,
        amount: document.getElementById('amount').value
      };

      // ส่งข้อมูลไปยัง Google Apps Script ผ่าน fetch
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(data)
      })
      .then(function(response) { return response.text(); })
      .then(function(text) {
        status.style.display = 'block';
        btn.textContent = 'บันทึกเรียบร้อย';

        // ส่งข้อความสรุปเข้าแชท LINE
        if (liffReady) {
          if (liff.isLoggedIn()) {
            liff.sendMessages([
              {
                type: 'text',
                text: '📝 บันทึกรายจ่าย\nรายการ: ' + data.item + '\nหมวดหมู่: ' + data.category + '\nจำนวน: ' + data.amount + ' บาท'
              }
            ]).then(function() {
              alert('ส่งข้อความสำเร็จ!');
              liff.closeWindow();
            }).catch(function(err) {
              alert('sendMessages Error: ' + err.message);
              console.error('sendMessages error:', err);
              setTimeout(function() { liff.closeWindow(); }, 1500);
            });
          } else {
            alert('LIFF Not Logged In!');
          }
        } else {
          alert('LIFF SDK Not Ready!');
          // กรณีเปิดบนเบราว์เซอร์ปกติ (ไม่ผ่าน LINE)
          setTimeout(function() {
            document.getElementById('expenseForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            typeSelect.dispatchEvent(new Event('change'));
            status.style.display = 'none';
            btn.textContent = 'บันทึกข้อมูล';
            btn.disabled = false;
          }, 2000);
        }
      })
      .catch(function(error) {
        alert('เกิดข้อผิดพลาด: ' + error.message);
        btn.textContent = 'บันทึกข้อมูล';
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
